openapi: 3.0.0
info:
  title: UMC Mission API
  description: 쿼리스트링과 헤더를 활용한 홈, 마이페이지, 리뷰, 미션, 회원가입 API 명세
  version: 1.0.1

servers:
  - url: http://localhost:8080/api

paths:
  /users/signup:
    post:
      summary: 회원 가입 하기
      description: 새로운 유저를 생성합니다. (가입 시에는 토큰 헤더가 필요 없음)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SignupRequest'
      responses:
        '201':
          description: 회원가입 성공

  /home:
    get:
      summary: 서비스 홈 화면
      description: 사용자 맞춤 홈 화면 데이터를 조회합니다.
      parameters:
        - $ref: '#/components/parameters/AuthHeader'
        - name: region
          in: query
          description: 추천 식당을 필터링할 지역 (예시 - 강남구, 용인시)
          required: false
          schema:
            type: string
      responses:
        '200':
          description: 홈 화면 데이터 조회 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HomeResponse'

  /users/me:
    get:
      summary: 마이 페이지 조회
      description: 헤더의 토큰을 기반으로 내 정보를 조회합니다.
      parameters:
        - $ref: '#/components/parameters/AuthHeader'
      responses:
        '200':
          description: 마이 페이지 조회 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MyPageResponse'

  /stores/{storeId}/reviews:
    post:
      summary: 리뷰 작성
      description: 특정 식당에 대한 리뷰를 작성합니다.
      parameters:
        - $ref: '#/components/parameters/AuthHeader'
        - name: storeId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReviewCreateRequest'
      responses:
        '201':
          description: 리뷰 작성 성공

  /users/me/missions:
    get:
      summary: 미션 목록 조회 (진행중/진행완료)
      description: 쿼리스트링을 통해 미션 상태를 필터링하고, 페이징 처리하여 목록을 조회합니다.
      parameters:
        - $ref: '#/components/parameters/AuthHeader'
        - name: isCompleted
          in: query
          description: 미션 완료 여부 (0=진행중, 1=진행완료)
          required: true
          schema:
            type: integer
            enum: [0, 1]
        - name: page
          in: query
          description: 페이지 번호 (1부터 시작)
          required: false
          schema:
            type: integer
            default: 1
        - name: size
          in: query
          description: 한 페이지당 조회할 미션 수
          required: false
          schema:
            type: integer
            default: 10
      responses:
        '200':
          description: 미션 목록 조회 성공
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/MissionResponse'

  /missions/{missionId}/complete:
    patch:
      summary: 미션 성공 누르기
      description: 진행 중인 미션의 상태를 완료로 변경합니다.
      parameters:
        - $ref: '#/components/parameters/AuthHeader'
        - name: missionId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: 미션 완료 처리 성공
  /regions/{regionId}/stores:
    post:
      summary: 특정 지역에 가게 추가하기
      description: 특정 지역에 새로운 가게를 추가합니다.
      parameters:
        - $ref: '#/components/parameters/AuthHeader'
        - name: regionId
          in: path
          required: true
          description: 가게를 추가할 지역 ID
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StoreCreateRequest'
      responses:
        '201':
          description: 가게 추가 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StoreResponse'
        '404':
          description: 존재하지 않는 지역입니다.

  /stores/{storeId}/reviews:
    post:
      summary: 가게에 리뷰 추가하기
      description: 특정 가게에 리뷰를 추가합니다. 리뷰를 추가하려는 가게가 존재하는지 검증합니다.
      parameters:
        - $ref: '#/components/parameters/AuthHeader'
        - name: storeId
          in: path
          required: true
          description: 리뷰를 추가할 가게 ID
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReviewCreateRequest'
      responses:
        '201':
          description: 리뷰 추가 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReviewResponse'
        '404':
          description: 존재하지 않는 가게입니다.

  /stores/{storeId}/missions:
    post:
      summary: 가게에 미션 추가하기
      description: 특정 가게에 새로운 미션을 추가합니다.
      parameters:
        - $ref: '#/components/parameters/AuthHeader'
        - name: storeId
          in: path
          required: true
          description: 미션을 추가할 가게 ID
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MissionCreateRequest'
      responses:
        '201':
          description: 미션 추가 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MissionResponse'
        '404':
          description: 존재하지 않는 가게입니다.

  /missions/{missionId}/challenge:
    post:
      summary: 미션 도전하기
      description: 특정 가게의 미션을 사용자의 도전 중인 미션에 추가합니다. 이미 도전 중인 미션인지 검증합니다.
      parameters:
        - $ref: '#/components/parameters/AuthHeader'
        - name: missionId
          in: path
          required: true
          description: 도전할 미션 ID
          schema:
            type: string
            format: uuid
      responses:
        '201':
          description: 미션 도전 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserMissionResponse'
        '404':
          description: 존재하지 않는 미션입니다.
        '409':
          description: 이미 도전 중인 미션입니다.

components:
  schemas:
    StoreCreateRequest:
      type: object
      required:
        - name
        - address
      properties:
        name:
          type: string
          description: 가게 이름
        address:
          type: string
          description: 가게 주소
        category:
          type: string
          description: 가게 카테고리
        phoneNumber:
          type: string
          description: 가게 전화번호

    StoreResponse:
      type: object
      properties:
        storeId:
          type: string
          format: uuid
        regionId:
          type: string
          format: uuid
        name:
          type: string
        address:
          type: string
        category:
          type: string
        phoneNumber:
          type: string

    ReviewResponse:
      type: object
      properties:
        reviewId:
          type: string
          format: uuid
        storeId:
          type: string
          format: uuid
        userId:
          type: string
          format: uuid
        contents:
          type: string
        rating:
          type: integer
        createdAt:
          type: string
          format: date-time

    MissionCreateRequest:
      type: object
      required:
        - point
        - dueDate
        - description
      properties:
        point:
          type: integer
          description: 미션 성공 시 지급 포인트
        dueDate:
          type: string
          format: date
          description: 미션 마감일
        description:
          type: string
          description: 미션 내용

    UserMissionResponse:
      type: object
      properties:
        userMissionId:
          type: string
          format: uuid
        missionId:
          type: string
          format: uuid
        storeId:
          type: string
          format: uuid
        userId:
          type: string
          format: uuid
        isCompleted:
          type: integer
          enum: [0, 1]
        challengedAt:
          type: string
          format: date-time

components:
  parameters:
    AuthHeader:
      name: Authorization
      in: header
      description: Bearer 토큰 (유저 인증용)
      required: true
      schema:
        type: string
        example: "Bearer eyJhbGciOiJIUzI1NiIsInR5c..."

  schemas:
    SignupRequest:
      type: object
      properties:
        gender:
          type: string
          enum: [M, F, N]
        birthDate:
          type: string
          format: date
        addressMain:
          type: string
        addressDetail:
          type: string

    HomeResponse:
      type: object
      properties:
        myPoints:
          type: integer
        recommendedStores:
          type: array
          items:
            type: string
            description: 추천 식당 이름 목록

    MyPageResponse:
      type: object
      properties:
        phoneNumber:
          type: string
        points:
          type: integer

    ReviewCreateRequest:
      type: object
      properties:
        contents:
          type: string
        rating:
          type: integer

    MissionResponse:
      type: object
      properties:
        missionId:
          type: string
          format: uuid
        storeId:
          type: string
          format: uuid
        point:
          type: integer
        dueDate:
          type: string
          format: date
        isCompleted:
          type: integer